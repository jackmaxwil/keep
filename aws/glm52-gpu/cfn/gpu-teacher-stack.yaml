  # AWS::Scheduler::Schedule does not expose the Scheduler API's
  # ActionAfterCompletion property. This exact-schedule custom resource applies
  # DELETE through UpdateSchedule after CloudFormation creates or updates it.
  SkyMustStartScheduleAutoDeleteRole:
    Type: AWS::IAM::Role
    Condition: SkyMustStartCoordinatorEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: update-exact-must-start-schedule-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UpdateExactMustStartSchedule
                Effect: Allow
                Action: scheduler:UpdateSchedule
                Resource: !Sub "arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${ProjectTag}-sky-must-start-deadline"
              - Sid: PassExactSchedulerExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SkyMustStartSchedulerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: scheduler.amazonaws.com

  SkyMustStartScheduleAutoDeleteFunction:
    Type: AWS::Lambda::Function
    Condition: SkyMustStartCoordinatorEnabled
    Properties:
      FunctionName: !Sub "${ProjectTag}-sky-must-start-schedule-auto-delete"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt SkyMustStartScheduleAutoDeleteRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import time

          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError


          def handler(event, context):
              properties = event["ResourceProperties"]
              physical_id = (
                  "must-start-schedule-auto-delete:"
                  + properties["ScheduleName"]
              )
              try:
                  if event["RequestType"] != "Delete":
                      scheduler = boto3.client("scheduler")
                      request = {
                          "Name": properties["ScheduleName"],
                          "GroupName": "default",
                          "ActionAfterCompletion": "DELETE",
                          "FlexibleTimeWindow": {"Mode": "OFF"},
                          "ScheduleExpression": properties[
                              "ScheduleExpression"
                          ],
                          "ScheduleExpressionTimezone": "UTC",
                          "State": "ENABLED",
                          "Target": {
                              "Arn": properties["TargetArn"],
                              "RoleArn": properties["TargetRoleArn"],
                              "Input": properties["TargetInput"],
                              "RetryPolicy": {
                                  "MaximumEventAgeInSeconds": 300,
                                  "MaximumRetryAttempts": 2,
                              },
                              "DeadLetterConfig": {
                                  "Arn": properties["DeadLetterArn"]
                              },
                          },
                      }
                      for attempt in range(5):
                          try:
                              scheduler.update_schedule(**request)
                              break
                          except ClientError as error:
                              code = error.response.get("Error", {}).get(
                                  "Code"
                              )
                              if code != "ResourceNotFoundException" or (
                                  attempt == 4
                              ):
                                  raise
                              time.sleep(2)
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.SUCCESS,
                      {},
                      physical_id,
                  )
              except Exception as error:
                  cfnresponse.send(
                      event,
                      context,
                      cfnresponse.FAILED,
                      {"Error": str(error)},
                      physical_id,
                  )

  SkyMustStartDeadlineScheduleAutoDelete:
    Type: Custom::SchedulerActionAfterCompletion
    Condition: SkyMustStartCoordinatorEnabled
    Properties:
      ServiceToken: !GetAtt SkyMustStartScheduleAutoDeleteFunction.Arn
      ActionAfterCompletion: DELETE
      ScheduleName: !Ref SkyMustStartDeadlineSchedule
      ScheduleExpression: !Join
        - ""
        - - "at("
          - !Select [0, !Split ["Z", !Ref SkyMustStartPrimaryWakeAt]]
          - ")"
      TargetArn: !GetAtt SkyMustStartCancelFunction.Arn
      TargetRoleArn: !GetAtt SkyMustStartSchedulerRole.Arn
      TargetInput: !Sub '{"campaign_run_id":"${SkyCampaignRunId}","managed_mode":"${SkyMustStartManagedMode}","sky_job_name":"${SkyMustStartJobName}","must_start_by":"${SkyMustStartBy}","trigger":"primary-deadline"}'
