  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectTag}-gpu-node"
      LaunchTemplateData:
        ImageId: !Ref GpuAmiId
        InstanceType: !Ref GpuInstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: true
            SubnetId: !Ref PublicSubnet
            Groups: [ !Ref InstanceSecurityGroup ]
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: !Ref RootVolumeGiB
              VolumeType: gp3
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpTokens: required        # IMDSv2 only
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Sub "${ProjectTag}-gpu-node" }
              - { Key: project, Value: !Ref ProjectTag }
              - { Key: owner, Value: !Ref OwnerTag }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            # No `set -e`: a single failed step must not silently kill the bootstrap.
            set -uxo pipefail
            exec > /var/log/keep-bootstrap.log 2>&1
            mkdir -p /mnt/nvme
            # The Deep Learning AMI pre-claims ALL instance-store NVMe as an LVM
            # volume (vg.01-lv_ephemeral) mounted at /opt/dlami/nvme — raw mkfs
            # fails with "device busy". Prefer the AMI-managed volume; fall back
            # to raw NVMe RAID0 only on non-DLAMI images.
            for i in $(seq 1 12); do
              mountpoint -q /opt/dlami/nvme && break
              sleep 5
            done
            if mountpoint -q /opt/dlami/nvme; then
              mkdir -p /opt/dlami/nvme/staging
              mount --bind /opt/dlami/nvme/staging /mnt/nvme
            else
              NVME=$(lsblk -dn -o NAME,MODEL | awk '/Instance Storage/ {print "/dev/"$1}')
              COUNT=$(echo "$NVME" | grep -c . || true)
              if [ "$COUNT" -ge 2 ]; then
                mdadm --create /dev/md0 --level=0 --raid-devices="$COUNT" $NVME || true
                mkfs.xfs -f /dev/md0 && mount /dev/md0 /mnt/nvme
              elif [ "$COUNT" -eq 1 ]; then
                mkfs.xfs -f $NVME && mount $NVME /mnt/nvme
              fi
            fi
            chmod 777 /mnt/nvme || true
            # --- s5cmd for parallel S3 transfer ---
            curl -sSL https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz \
              | tar -xz -C /usr/local/bin s5cmd || true
            # --- signal readiness marker for operators ---
            echo "ready $(date -u +%FT%TZ) nvme_count=$COUNT" > /mnt/nvme/BOOTSTRAP_READY || true
            CAMPAIGN_PARAMETER='${CampaignDescriptorParameterName}'
            if aws ssm get-parameter --name "$CAMPAIGN_PARAMETER" --query Parameter.Value --output text \
              > /tmp/keep-campaign-parameter.json 2>/dev/null; then
              install -d -m 0755 /etc/keep-glm52 /opt/keep-campaign/repo /run/keep-glm52
              mv /tmp/keep-campaign-parameter.json /etc/keep-glm52/campaign.json
              python3 - /etc/keep-glm52/campaign.json <<'PY'
            import hashlib, json, sys
            path = sys.argv[1]
            value = json.load(open(path))
            digest = value.pop("descriptor_body_sha256")
            raw = json.dumps(value, sort_keys=True, separators=(",", ":")).encode()
            if hashlib.sha256(raw).hexdigest() != digest:
                raise SystemExit("campaign descriptor identity mismatch")
            value["descriptor_body_sha256"] = digest
            open(path, "w").write(json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n")
            PY
              BUCKET=$(python3 -c 'import json; print(json.load(open("/etc/keep-glm52/campaign.json"))["bucket"])')
              DESCRIPTOR_KEY=$(python3 -c 'import json; print(json.load(open("/etc/keep-glm52/campaign.json"))["campaign_descriptor_key"])')
              REPO_KEY=$(python3 -c 'import json; print(json.load(open("/etc/keep-glm52/campaign.json"))["repo_tar_key"])')
              REPO_SHA=$(python3 -c 'import json; print(json.load(open("/etc/keep-glm52/campaign.json"))["repo_tar_sha256"])')
              aws s3 cp "s3://$BUCKET/$DESCRIPTOR_KEY" /tmp/campaign-from-s3.json
              cmp /etc/keep-glm52/campaign.json /tmp/campaign-from-s3.json
              aws s3 cp "s3://$BUCKET/$REPO_KEY" /tmp/keep-campaign.tar.gz
              echo "$REPO_SHA  /tmp/keep-campaign.tar.gz" | sha256sum -c -
              tar -xzf /tmp/keep-campaign.tar.gz -C /opt/keep-campaign/repo
              cat >/etc/systemd/system/keep-glm52-campaign.service <<'UNIT'
            [Unit]
            Description=Durable GLM-5.2 teacher-to-training campaign
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            WorkingDirectory=/opt/keep-campaign/repo
            Environment=CAMPAIGN_DESCRIPTOR=/etc/keep-glm52/campaign.json
            Environment=PYTHONUNBUFFERED=1
            ExecStart=/opt/keep-campaign/repo/aws/glm52-gpu/scripts/run_campaign.sh
            KillSignal=SIGTERM
            SuccessExitStatus=75
            TimeoutStopSec=1800
            Restart=on-failure
            RestartSec=60

            [Install]
            WantedBy=multi-user.target
            UNIT
              systemctl daemon-reload
              systemctl enable --now keep-glm52-campaign.service
            fi
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - { Key: project, Value: !Ref ProjectTag }

