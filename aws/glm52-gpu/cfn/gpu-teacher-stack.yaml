AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  KEEP GLM-5.2 GPU teacher-gen stack (R&D sandbox 246813579024). Templatized,
  reusable infra for running the bf16 source-teacher forward on NVIDIA GPUs via
  MLX-CUDA, pulling the model fast from S3. Deploying this stack is $0 (VPC, S3
  gateway endpoint, retained bucket, IAM, SG, launch template) — GPU cost is only
  incurred when an instance is launched from the LaunchTemplate (see launch_instance.sh).

Parameters:
  ProjectTag:
    Type: String
    Default: keep-glm52
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Description: Tag applied to all resources for cost attribution.
  OwnerTag:
    Type: String
    Default: jack.mazac
    AllowedPattern: '^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$'
  GpuAmiId:
    # Evergreen: resolves the AWS Deep Learning Base OSS NVIDIA driver GPU AMI
    # (Ubuntu 22.04) at deploy time. Override with a pinned ami-id for repeatability.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id
  GpuInstanceType:
    Type: String
    Default: p5.48xlarge
    AllowedValues:
      - p5.48xlarge       # 8x H100 80GB (640GB) — full run, fastest
      - p5en.48xlarge     # 8x H200 141GB (1128GB) — bf16-resident
      - p4de.24xlarge     # 8x A100 80GB (640GB) — cheaper on-demand
      - g6e.48xlarge      # 8x L40S 48GB (384GB) — cheapest 8-GPU, slower
      - g6e.12xlarge      # 4x L40S (192GB)
      - g6e.2xlarge       # 1x L40S 48GB, 450GB NVMe — SEEDER/SPIKE (fits full snapshot)
      - g6e.xlarge        # 1x L40S 48GB, 250GB NVMe — small spike only
    Description: Default is the full-run box; use g6e.xlarge for the spike/seed.
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2c
    Description: Primary AZ (default us-west-2c — cheapest p5 spot at design time).
  AvailabilityZoneAlt:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2a
    Description: Fallback AZ #2 for GPU capacity retries.
  AvailabilityZone3:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2b
    Description: Fallback AZ #3 for GPU capacity retries.
  AvailabilityZone4:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2d
    Description: Fallback AZ #4 for GPU capacity retries.
  AvailabilityZone5:
    Type: String
    Default: ""
    Description: Optional fallback AZ #5 (blank = skip; regions with >4 AZs, e.g. us-east-1e).
  AvailabilityZone6:
    Type: String
    Default: ""
    Description: Optional fallback AZ #6 (blank = skip; e.g. us-east-1f).
  RootVolumeGiB:
    Type: Number
    Default: 300
    Description: gp3 root EBS size. Model data lands on instance-store NVMe, not here.
  EnableCampaignController:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableSkyPilotSupport:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable AWS-only SkyPilot IAM, watchdog, alerts, and cost backstops.
  EnableSkyWorkerStartV2Coordinator:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  EnableSkyMustStartCancel:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Explicit opt-in for exact-ID must-start cancellation. Leave false until
      the observe-only binding has passed independent review.
  EnableSkyMustStartObserve:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Deploy the exact must-start coordinator in observation-only mode. This
      cannot cancel a job and is the required gate before active mode.
  CampaignRunId:
    Type: String
    Default: disabled
  CapacityReservationId:
    Type: String
    Default: ""
  CampaignDescriptorParameterName:
    Type: String
    Default: /keep-glm52/campaign/active
  CampaignDescriptorJson:
    Type: String
    Default: "{}"
    NoEcho: true
  ControllerCodeS3Key:
    Type: String
    Default: disabled/not-deployed-controller.zip
  SkyCampaignRunId:
    Type: String
    Default: disabled
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
  SkyCampaignDescriptorKey:
    Type: String
    Default: ""
    AllowedPattern: '^$|^campaigns/[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?/submissions/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*\.json$'
  SkyWatchdogCodeS3Key:
    Type: String
    Default: disabled/not-deployed-sky-watchdog.zip
  SkyWorkerStartV2FoundationRevision:
    Type: String
    Default: disabled
    AllowedValues: [disabled, versioned-code-v1]
  SkyWorkerStartV2CodeSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyWorkerStartV2CodeVersionId:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^(?!null$)(?!None$)(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._~+/=-]{1,1024}$'
  SkyWorkerStartV2DescriptorRelativeKey:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^submissions/qualification/(?:[A-Za-z0-9][A-Za-z0-9._-]{0,255}/)*[A-Za-z0-9][A-Za-z0-9._-]{0,250}\.json$'
  SkyWorkerStartV2DescriptorFileSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyWorkerStartV2IntentFileSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyWorkerStartV2IntentBodySha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyWorkerStartV2ControllerInstanceId:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^i-[0-9a-f]{17}$'
  SkyWorkerStartV2ControllerClusterName:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^sky-jobs-controller-[A-Za-z0-9._-]+$'
  SkyMustStartCancelCodeSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyMustStartCancelCodeVersionId:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^(?!null$)(?!None$)(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._~+/=-]{1,1024}$'
    Description: >-
      Exact immutable S3 VersionId for the content-addressed must-start Lambda
      ZIP. Capture this from the reviewed versioned upload; never use latest.
  SkyMustStartFoundationRevision:
    Type: String
    Default: disabled
    AllowedValues: [disabled, versioned-code-v1]
    Description: >-
      Durable proof that the reviewed bucket-versioning and runtime-deny
      foundation was installed before coordinator code may be consumed.
  SkyMustStartActivationJobBindingSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyMustStartActivationObservationSha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
  SkyMustStartDescriptorRelativeKey:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^submissions/(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9][A-Za-z0-9._/-]*\.json$'
    Description: >-
      Descriptor key relative to campaigns/<SkyCampaignRunId>/; the stack
      derives the run prefix so IAM cannot be pointed at a foreign run.
  SkyMustStartSubmissionBodySha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
    Description: Exact authenticated submission body SHA-256 used in marker paths.
  SkyMustStartControllerBaselineBodySha256:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[0-9a-f]{64}$'
    Description: >-
      Exact authenticated controller-baseline body SHA-256 reviewed by the
      submission join before coordinator activation.
  SkyMustStartTargetJobId:
    Type: String
    Default: "-1"
    AllowedPattern: "^-1$|^[1-9][0-9]*$"
    Description: >-
      Explicitly observed controller job ID for current-job compatibility;
      -1 permits fail-closed unique nonterminal discovery for future bundles.
  SkyMustStartManagedMode:
    Type: String
    Default: cache-seed
    AllowedValues:
      - production
      - qualification
      - cache-seed
  SkyMustStartJobName:
    Type: String
    Default: disabled-cache-seed
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,126}[a-z0-9])?$'
  SkyMustStartBy:
    Type: String
    Default: "1970-01-01T00:00:00Z"
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
  SkyMustStartPrimaryWakeAt:
    Type: String
    Default: "1970-01-01T00:00:00Z"
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    Description: >-
      Canonical UTC primary wake time derived as exactly one minute before
      SkyMustStartBy by the guarded deployment workflow.
  SkyMustStartWorkspace:
    Type: String
    Default: default
    AllowedValues: [default]
  SkyMustStartDescriptorFileSha256:
    Type: String
    Default: disabled
    AllowedPattern: "^disabled$|^[0-9a-f]{64}$"
  SkyMustStartSubmissionSubmittedAt:
    Type: String
    Default: "1970-01-01T00:00:00Z"
    AllowedPattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,6})?Z$'
  SkyMustStartControllerInstanceId:
    Type: String
    Default: disabled
    AllowedPattern: "^disabled$|^i-[0-9a-f]{8,32}$"
  SkyMustStartControllerInstanceType:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^[a-z0-9][a-z0-9.-]{1,31}$'
  SkyMustStartControllerProfileArn:
    Type: String
    Default: disabled
    AllowedPattern: '^disabled$|^arn:aws:iam::246813579024:instance-profile/[A-Za-z0-9+=,.@_-]{1,128}$'
  SkyMustStartControllerClusterName:
    Type: String
    Default: disabled
    AllowedPattern: "^disabled$|^sky-jobs-controller-[A-Za-z0-9._-]+$"
  SkyMustStartStartingGraceSeconds:
    Type: Number
    Default: 20
    MinValue: 15
    MaxValue: 30
  CampaignAlertEmail:
    Type: String
    Default: operator@example.com
    Description: Email endpoint for controller and campaign watchdog alerts.
  SkyWatchdogRuleState:
    Type: String
    AllowedValues:
      - ENABLED
      - DISABLED
    Default: DISABLED
    Description: >-
      State of the campaign watchdog schedule. DISABLED since the GLM-5.2
      retirement (2026-08-11); set ENABLED when a live campaign needs it.

Rules:
  SkyWorkerStartV2RequiresExactAuthority:
    RuleCondition: !Equals
      - !Ref EnableSkyWorkerStartV2Coordinator
      - "true"
    Assertions:
      - Assert: !Equals [!Ref EnableSkyPilotSupport, "true"]
        AssertDescription: Worker-start-v2 requires SkyPilot support.
      - Assert: !Equals [!Ref AWS::AccountId, "246813579024"]
        AssertDescription: Worker-start-v2 requires the approved AWS account.
      - Assert: !Equals [!Ref AWS::Region, "us-west-2"]
        AssertDescription: Worker-start-v2 requires the approved AWS region.
      - Assert: !Not [!Equals [!Ref SkyCampaignRunId, disabled]]
        AssertDescription: Worker-start-v2 requires an exact campaign run.
      - Assert: !Equals
          - !Ref SkyWorkerStartV2FoundationRevision
          - versioned-code-v1
        AssertDescription: Worker-start-v2 requires the versioned code foundation.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2CodeSha256, disabled]]
        AssertDescription: Worker-start-v2 requires exact Lambda code bytes.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2CodeVersionId, disabled]]
        AssertDescription: Worker-start-v2 requires an exact S3 code version.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2DescriptorRelativeKey, disabled]]
        AssertDescription: Worker-start-v2 requires an exact descriptor key.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2DescriptorFileSha256, disabled]]
        AssertDescription: Worker-start-v2 requires exact descriptor bytes.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2IntentFileSha256, disabled]]
        AssertDescription: Worker-start-v2 requires exact intent file bytes.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2IntentBodySha256, disabled]]
        AssertDescription: Worker-start-v2 requires an exact intent body.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2ControllerInstanceId, disabled]]
        AssertDescription: Worker-start-v2 requires an exact controller instance.
      - Assert: !Not [!Equals [!Ref SkyWorkerStartV2ControllerClusterName, disabled]]
        AssertDescription: Worker-start-v2 requires an exact controller cluster.
  SkyMustStartCoordinatorRequiresExactAuthority:
    RuleCondition: !Or
      - !Equals [!Ref EnableSkyMustStartObserve, "true"]
      - !Equals [!Ref EnableSkyMustStartCancel, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref SkyCampaignRunId, disabled]]
        AssertDescription: Must-start coordination requires an exact campaign run.
      - Assert: !Not [!Equals [!Ref SkyMustStartFoundationRevision, disabled]]
        AssertDescription: >-
          Must-start coordination requires the reviewed versioned-code
          foundation to be installed first.
      - Assert: !Not [!Equals [!Ref SkyMustStartCancelCodeSha256, disabled]]
        AssertDescription: Must-start coordination requires exact Lambda code bytes.
      - Assert: !Not [!Equals [!Ref SkyMustStartCancelCodeVersionId, disabled]]
        AssertDescription: Must-start coordination requires an exact S3 code version.
      - Assert: !Not [!Equals [!Ref SkyMustStartDescriptorRelativeKey, disabled]]
        AssertDescription: Must-start coordination requires an exact descriptor key.
      - Assert: !Not [!Equals [!Ref SkyMustStartSubmissionBodySha256, disabled]]
        AssertDescription: Must-start coordination requires an exact submission.
      - Assert: !Not [!Equals [!Ref SkyMustStartControllerBaselineBodySha256, disabled]]
        AssertDescription: >-
          Must-start coordination requires the exact reviewed controller
          baseline body SHA-256.
      - Assert: !Not [!Equals [!Ref SkyMustStartTargetJobId, "-1"]]
        AssertDescription: Must-start coordination requires an exact controller job ID.
      - Assert: !Not [!Equals [!Ref SkyMustStartJobName, disabled-cache-seed]]
        AssertDescription: Must-start coordination requires an exact SkyPilot job name.
      - Assert: !Not [!Equals [!Ref SkyMustStartBy, "1970-01-01T00:00:00Z"]]
        AssertDescription: Must-start coordination requires an exact deadline.
      - Assert: !Not [!Equals [!Ref SkyMustStartPrimaryWakeAt, "1970-01-01T00:00:00Z"]]
        AssertDescription: Must-start coordination requires an exact primary wake.
      - Assert: !Not [!Equals [!Ref SkyMustStartDescriptorFileSha256, disabled]]
        AssertDescription: Must-start coordination requires exact descriptor bytes.
      - Assert: !Not [!Equals [!Ref SkyMustStartSubmissionSubmittedAt, "1970-01-01T00:00:00Z"]]
        AssertDescription: Must-start coordination requires exact submission time.
      - Assert: !Not [!Equals [!Ref SkyMustStartControllerInstanceId, disabled]]
        AssertDescription: Must-start coordination requires an exact controller instance.
      - Assert: !Not [!Equals [!Ref SkyMustStartControllerInstanceType, disabled]]
        AssertDescription: Must-start coordination requires exact controller type.
      - Assert: !Not [!Equals [!Ref SkyMustStartControllerProfileArn, disabled]]
        AssertDescription: Must-start coordination requires exact controller identity.
      - Assert: !Not [!Equals [!Ref SkyMustStartControllerClusterName, disabled]]
        AssertDescription: Must-start coordination requires exact controller cluster.
  SkyMustStartCancelRequiresObservedTarget:
    RuleCondition: !Or
      - !Equals [!Ref EnableSkyMustStartObserve, "true"]
      - !Equals [!Ref EnableSkyMustStartCancel, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref SkyMustStartTargetJobId, "-1"]]
        AssertDescription: >-
          Must-start observation or cancellation requires an explicitly
          observed exact controller job ID.
  SkyMustStartCancelRequiresObservationGate:
    RuleCondition: !Equals [!Ref EnableSkyMustStartCancel, "true"]
    Assertions:
      - Assert: !Equals [!Ref EnableSkyMustStartObserve, "true"]
        AssertDescription: >-
          Active must-start cancellation requires the observation deployment
          gate to remain enabled.
  SkyMustStartCancelRequiresAuthenticatedObservation:
    RuleCondition: !Equals [!Ref EnableSkyMustStartCancel, "true"]
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref SkyMustStartActivationJobBindingSha256
            - disabled
        AssertDescription: >-
          Active cancellation requires the exact authenticated prior
          JOB_BINDING.json body SHA-256.
      - Assert: !Not
          - !Equals
            - !Ref SkyMustStartActivationObservationSha256
            - disabled
        AssertDescription: >-
          Active cancellation requires the exact content-addressed prior
          controller observation SHA-256.

Conditions:
  Az5Enabled: !Not [!Equals [!Ref AvailabilityZone5, ""]]
  Az6Enabled: !Not [!Equals [!Ref AvailabilityZone6, ""]]
  CampaignControllerEnabled: !Equals [!Ref EnableCampaignController, "true"]
  SkyPilotSupportEnabled: !Equals [!Ref EnableSkyPilotSupport, "true"]
  SkyWorkerStartV2CoordinatorEnabled: !And
    - !Condition SkyPilotSupportEnabled
    - !Equals [!Ref EnableSkyWorkerStartV2Coordinator, "true"]
    - !Equals [!Ref AWS::AccountId, "246813579024"]
    - !Equals [!Ref AWS::Region, "us-west-2"]
  SkyMustStartCoordinatorEnabled: !And
    - !Condition SkyPilotSupportEnabled
    - !Or
      - !Equals [!Ref EnableSkyMustStartObserve, "true"]
      - !Equals [!Ref EnableSkyMustStartCancel, "true"]
  SkyMustStartCancelEnabled: !And
    - !Condition SkyPilotSupportEnabled
    - !Equals [!Ref EnableSkyMustStartCancel, "true"]
  CampaignAlertsEnabled: !Or
    - !Equals [!Ref EnableCampaignController, "true"]
    - !Equals [!Ref EnableSkyPilotSupport, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-vpc" }
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-igw" }
        - { Key: project, Value: !Ref ProjectTag }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-a" }
        - { Key: project, Value: !Ref ProjectTag }

  # Second AZ so a launch can fall back when the primary AZ has no GPU
  # capacity (hit InsufficientInstanceCapacity for g6e.2xlarge in us-west-2c).
  PublicSubnetAltAz:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Ref AvailabilityZoneAlt
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-alt-az" }
        - { Key: project, Value: !Ref ProjectTag }

  SubnetAltAzRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAltAz
      RouteTableId: !Ref PublicRouteTable

  # p5/p5en capacity is genuinely scarce; two more AZs to try on launch.
  PublicSubnetAz3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.3.0/24
      AvailabilityZone: !Ref AvailabilityZone3
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-az3" }
        - { Key: project, Value: !Ref ProjectTag }

  SubnetAz3RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz3
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetAz4:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.4.0/24
      AvailabilityZone: !Ref AvailabilityZone4
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-az4" }
        - { Key: project, Value: !Ref ProjectTag }

  SubnetAz4RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetAz4
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetAz5:
    Type: AWS::EC2::Subnet
    Condition: Az5Enabled
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.5.0/24
      AvailabilityZone: !Ref AvailabilityZone5
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-az5" }
        - { Key: project, Value: !Ref ProjectTag }

  SubnetAz5RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: Az5Enabled
    Properties:
      SubnetId: !Ref PublicSubnetAz5
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetAz6:
    Type: AWS::EC2::Subnet
    Condition: Az6Enabled
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.6.0/24
      AvailabilityZone: !Ref AvailabilityZone6
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-az6" }
        - { Key: project, Value: !Ref ProjectTag }

  SubnetAz6RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: Az6Enabled
    Properties:
      SubnetId: !Ref PublicSubnetAz6
      RouteTableId: !Ref PublicRouteTable

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-public-rt" }
        - { Key: project, Value: !Ref ProjectTag }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Free, high-throughput S3 access from EC2 without NAT or public egress cost.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable

  # No inbound. Access is via SSM Session Manager (no SSH keys to manage).
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: keep-glm52-gpu-sg
      GroupDescription: !Sub "${ProjectTag} GPU node - egress only, SSM access"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all egress (PyPI, HuggingFace, S3, SSM)
      Tags:
        - { Key: Name, Value: !Sub "${ProjectTag}-gpu-sg" }
        - { Key: project, Value: !Ref ProjectTag }

  # Model/artifact bucket. RETAINED on stack delete so teardown never nukes ~250GB.
  ModelBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "keep-glm52-models-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration: !If
        - SkyWorkerStartV2CoordinatorEnabled
        - EventBridgeConfiguration:
            EventBridgeEnabled: true
        - !Ref AWS::NoValue
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  S3BatchChecksumRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: keep-glm52-s3-checksum-auditor
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: batchoperations.s3.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
