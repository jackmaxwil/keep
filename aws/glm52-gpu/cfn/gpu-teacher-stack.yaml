                Effect: Allow
                Action: ec2:DescribeRegions
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ReadApprovedRegion
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ssm:DescribeInstanceInformation
                  - ssm:GetConnectionStatus
