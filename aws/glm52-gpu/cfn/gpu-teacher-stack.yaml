                    aws:RequestedRegion: !Ref AWS::Region
              - Sid: UseWorkerStartV2RunShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: SendWorkerStartV2ControllerCommand
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${SkyWorkerStartV2ControllerInstanceId}"
                Condition:
                  StringEquals:
                    ssm:resourceTag/project: !Ref ProjectTag
                    ssm:resourceTag/owner: !Ref OwnerTag
                    ssm:resourceTag/model: glm-5.2
                    ssm:resourceTag/campaign-run-id: !Ref SkyCampaignRunId
                    ssm:resourceTag/cost-allocation: glm52-sky-campaign
                    ssm:resourceTag/ray-cluster-name: !Ref SkyWorkerStartV2ControllerClusterName
              - Sid: SendWorkerStartV2DeadLetter
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SkyWorkerStartV2DeadLetterQueue.Arn
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: model, Value: glm-5.2 }
        - { Key: campaign-run-id, Value: !Ref SkyCampaignRunId }

  SkyWorkerStartV2Function:
    Type: AWS::Lambda::Function
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      FunctionName: !Sub "${ProjectTag}-sky-worker-start-v2"
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: !GetAtt SkyWorkerStartV2Role.Arn
      ReservedConcurrentExecutions: 1
      Timeout: 300
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt SkyWorkerStartV2DeadLetterQueue.Arn
      Code:
        S3Bucket: !Ref ModelBucket
        S3Key: !Sub "lambda/sky-worker-start-v2/${SkyWorkerStartV2CodeSha256}.zip"
        S3ObjectVersion: !Ref SkyWorkerStartV2CodeVersionId
      Environment:
        Variables:
          WORKER_START_EXPECTED_ACCOUNT_ID: "246813579024"
          WORKER_START_BUCKET: !Ref ModelBucket
          WORKER_START_DESCRIPTOR_KEY: !Sub "campaigns/${SkyCampaignRunId}/${SkyWorkerStartV2DescriptorRelativeKey}"
          WORKER_START_DESCRIPTOR_FILE_SHA256: !Ref SkyWorkerStartV2DescriptorFileSha256
          WORKER_START_INTENT_KEY: !Sub "campaigns/${SkyCampaignRunId}/submissions/qualification/intents/${SkyWorkerStartV2IntentBodySha256}/SKYPILOT_SUBMISSION_INTENT.json"
          WORKER_START_INTENT_FILE_SHA256: !Ref SkyWorkerStartV2IntentFileSha256
          WORKER_START_INTENT_BODY_SHA256: !Ref SkyWorkerStartV2IntentBodySha256
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: model, Value: glm-5.2 }
        - { Key: campaign-run-id, Value: !Ref SkyCampaignRunId }

  SkyWorkerStartV2EventInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      FunctionName: !Ref SkyWorkerStartV2Function
      Qualifier: "$LATEST"
      MaximumRetryAttempts: 2
      MaximumEventAgeInSeconds: 900

  SkyWorkerStartV2LogGroup:
    Type: AWS::Logs::LogGroup
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectTag}-sky-worker-start-v2"
      RetentionInDays: 14

  SkyWorkerStartV2DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      Queues: [!Ref SkyWorkerStartV2DeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt SkyWorkerStartV2DeadLetterQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectTag}-sky-worker-start-v2"

  SkyWorkerStartV2ObjectCreatedRule:
    Type: AWS::Events::Rule
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: SkyWorkerStartV2DeadLetterQueuePolicy
    Properties:
      Name: !Sub "${ProjectTag}-sky-worker-start-v2"
      State: ENABLED
      EventPattern:
        account: [!Ref AWS::AccountId]
        region: [!Ref AWS::Region]
        source: [aws.s3]
        detail-type: ["Object Created"]
        resources: [!GetAtt ModelBucket.Arn]
        detail:
          bucket:
            name: [!Ref ModelBucket]
          reason: [PutObject]
          object:
            key:
              - wildcard: !Sub "campaigns/${SkyCampaignRunId}/monitor/must-start/qualification/${SkyWorkerStartV2IntentBodySha256}/worker-latches/i-*/*.json"
            version-id:
              - exists: true
      Targets:
        - Arn: !GetAtt SkyWorkerStartV2Function.Arn
          Id: sky-worker-start-v2
          RetryPolicy:
            MaximumEventAgeInSeconds: 900
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt SkyWorkerStartV2DeadLetterQueue.Arn
          InputTransformer:
            InputPathsMap:
              account_id: "$.account"
              region: "$.region"
              bucket: "$.detail.bucket.name"
              worker_latch_key: "$.detail.object.key"
              worker_latch_version_id: "$.detail.object.version-id"
            InputTemplate: !Sub '{"schema_version":1,"record_type":"glm52_sky_worker_start_v2_invocation_v1","account_id":<account_id>,"region":<region>,"bucket":<bucket>,"descriptor_key":"campaigns/${SkyCampaignRunId}/${SkyWorkerStartV2DescriptorRelativeKey}","descriptor_file_sha256":"${SkyWorkerStartV2DescriptorFileSha256}","intent_key":"campaigns/${SkyCampaignRunId}/submissions/qualification/intents/${SkyWorkerStartV2IntentBodySha256}/SKYPILOT_SUBMISSION_INTENT.json","intent_file_sha256":"${SkyWorkerStartV2IntentFileSha256}","intent_body_sha256":"${SkyWorkerStartV2IntentBodySha256}","worker_latch_key":<worker_latch_key>,"worker_latch_version_id":<worker_latch_version_id>}'

  SkyWorkerStartV2InvokePermission:
    Type: AWS::Lambda::Permission
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SkyWorkerStartV2Function
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SkyWorkerStartV2ObjectCreatedRule.Arn
      SourceAccount: !Ref AWS::AccountId

  SkyWorkerStartV2AuthorityBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Properties:
      Bucket: !Ref ModelBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyNonCoordinatorWorkerStartV2EvidenceWrites
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource:
              - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/qualification/${SkyWorkerStartV2IntentBodySha256}/worker-controller-observations/*"
              - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/qualification/${SkyWorkerStartV2IntentBodySha256}/worker-acceptances/*"
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt SkyWorkerStartV2Role.Arn

  SkyWorkerStartV2ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-worker-start-v2-errors"
      AlarmDescription: Worker-start-v2 Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SkyWorkerStartV2Function
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWorkerStartV2ThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-worker-start-v2-throttles"
      AlarmDescription: Worker-start-v2 Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref SkyWorkerStartV2Function
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWorkerStartV2AgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-worker-start-v2-age"
      AlarmDescription: Worker-start-v2 asynchronous invocation is delayed.
      Namespace: AWS/Lambda
      MetricName: AsyncEventAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref SkyWorkerStartV2Function
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 120000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWorkerStartV2DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-worker-start-v2-dlq-visible"
      AlarmDescription: Worker-start-v2 entered the dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SkyWorkerStartV2DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWorkerStartV2FailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyWorkerStartV2CoordinatorEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-worker-start-v2-failed-invocations"
      AlarmDescription: EventBridge failed to invoke worker-start-v2.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref SkyWorkerStartV2ObjectCreatedRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWatchdogDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: SkyPilotSupportEnabled
    Properties:
      QueueName: !Sub "${ProjectTag}-sky-watchdog-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: model, Value: glm-5.2 }
        - { Key: campaign-run-id, Value: !Ref SkyCampaignRunId }

  SkyWatchdogRole:
    Type: AWS::IAM::Role
    Condition: SkyPilotSupportEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: sky-watchdog-read-and-alert
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ssm:DescribeInstanceInformation
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - cloudwatch:DescribeAlarms
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/*"
              - Sid: DenyWritesToCoordinatorMustStartEvidence
                Effect: Deny
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/CANCEL_REQUESTED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/CANCEL_COMPLETED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/TARGET_BOUND.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/JOB_BINDING.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/TIMELY_START_ACCEPTED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/CANCEL_SUPERSEDED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/REQUEST_ALERTED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/COMPLETION_ALERTED.json"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/${SkyMustStartManagedMode}/${SkyMustStartSubmissionBodySha256}/observations/*"
              - Sid: DenyWritesToMustStartLambdaCode
                Effect: Deny
                Action: [s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub "${ModelBucket.Arn}/lambda/sky-must-start-cancel/*"
              - Sid: DenyWritesToSkyWorkerStartV2Evidence
                Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/qualification/${SkyWorkerStartV2IntentBodySha256}/worker-controller-observations/*"
                  - !Sub "${ModelBucket.Arn}/campaigns/${SkyCampaignRunId}/monitor/must-start/qualification/${SkyWorkerStartV2IntentBodySha256}/worker-acceptances/*"
              - Sid: DenyWritesToSkyWorkerStartV2LambdaCode
                Effect: Deny
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource:
                  - !Sub "${ModelBucket.Arn}/lambda/sky-worker-start-v2/*"
              - Sid: ListCampaignMarkers
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ModelBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub "campaigns/${SkyCampaignRunId}"
                      - !Sub "campaigns/${SkyCampaignRunId}/*"
              - Effect: Allow
                Action: [sqs:GetQueueAttributes, sqs:SendMessage]
                Resource: !GetAtt SkyWatchdogDeadLetterQueue.Arn
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref CampaignAlertTopic
              - Effect: Allow
                Action: events:DisableRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectTag}-sky-watchdog"

  SkyWatchdogFunction:
    Type: AWS::Lambda::Function
    Condition: SkyPilotSupportEnabled
    Properties:
      FunctionName: !Sub "${ProjectTag}-sky-watchdog"
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: !GetAtt SkyWatchdogRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt SkyWatchdogDeadLetterQueue.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          CAMPAIGN_BUCKET: !Ref ModelBucket
          CAMPAIGN_DESCRIPTOR_KEY: !Ref SkyCampaignDescriptorKey
          ALERT_TOPIC_ARN: !Ref CampaignAlertTopic
          WATCHDOG_DLQ_URL: !Ref SkyWatchdogDeadLetterQueue
          WATCHDOG_RULE_NAME: !Sub "${ProjectTag}-sky-watchdog"
      Code:
        S3Bucket: !Ref ModelBucket
        S3Key: !Ref SkyWatchdogCodeS3Key
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }
        - { Key: model, Value: glm-5.2 }
        - { Key: campaign-run-id, Value: !Ref SkyCampaignRunId }

  SkyWatchdogLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: SkyPilotSupportEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectTag}-sky-watchdog"
      RetentionInDays: 14

  SkyWatchdogDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: SkyPilotSupportEnabled
    Properties:
      Queues: [!Ref SkyWatchdogDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt SkyWatchdogDeadLetterQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectTag}-sky-watchdog"

  SkyWatchdogRule:
    Type: AWS::Events::Rule
    Condition: SkyPilotSupportEnabled
    DependsOn: SkyWatchdogDeadLetterQueuePolicy
    Properties:
      Name: !Sub "${ProjectTag}-sky-watchdog"
      ScheduleExpression: rate(10 minutes)
      State: !Ref SkyWatchdogRuleState
      Targets:
        - Arn: !GetAtt SkyWatchdogFunction.Arn
          Id: sky-watchdog
          RetryPolicy:
            MaximumEventAgeInSeconds: 600
            MaximumRetryAttempts: 2
          DeadLetterConfig:
            Arn: !GetAtt SkyWatchdogDeadLetterQueue.Arn

  SkyWatchdogInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: SkyPilotSupportEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SkyWatchdogFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SkyWatchdogRule.Arn

  SkyWatchdogErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyPilotSupportEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-watchdog-errors"
      AlarmDescription: Sky campaign watchdog Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SkyWatchdogFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWatchdogThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyPilotSupportEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-watchdog-throttles"
      AlarmDescription: Sky campaign watchdog Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref SkyWatchdogFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWatchdogDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyPilotSupportEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-watchdog-dlq-visible"
      AlarmDescription: Sky watchdog delivery entered the SQS dead-letter queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SkyWatchdogDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyWatchdogFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: SkyPilotSupportEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-sky-watchdog-failed-invocations"
      AlarmDescription: EventBridge failed to invoke the Sky watchdog target.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref SkyWatchdogRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  SkyGpuBudget:
    Type: AWS::Budgets::Budget
    Condition: SkyPilotSupportEnabled
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectTag}-${SkyCampaignRunId}-gpu"
        BudgetLimit: { Amount: 1320.96, Unit: USD }
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters:
          TagKeyValue:
            - "user:cost-allocation$glm52-sky-campaign"
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CampaignAlertEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref CampaignAlertEmail

  SkyCostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Condition: SkyPilotSupportEnabled
    Properties:
      MonitorName: !Sub "${ProjectTag}-${SkyCampaignRunId}"
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE
      ResourceTags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  SkyCostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    Condition: SkyPilotSupportEnabled
    Properties:
      SubscriptionName: !Sub "${ProjectTag}-${SkyCampaignRunId}"
      Frequency: DAILY
      MonitorArnList: [!Ref SkyCostAnomalyMonitor]
      ThresholdExpression: >-
        {"Dimensions":{"Key":"ANOMALY_TOTAL_IMPACT_ABSOLUTE","MatchOptions":["GREATER_THAN_OR_EQUAL"],"Values":["25"]}}
      Subscribers:
        - Type: EMAIL
          Address: !Ref CampaignAlertEmail

  CampaignDescriptorParameter:
    Type: AWS::SSM::Parameter
    Condition: CampaignControllerEnabled
    Properties:
      Name: !Ref CampaignDescriptorParameterName
      Type: String
      Value: !Ref CampaignDescriptorJson
      Description: Authenticated active GLM-5.2 Capacity Block campaign descriptor
      Tags:
        project: !Ref ProjectTag
        owner: !Ref OwnerTag

  CampaignControllerRole:
    Type: AWS::IAM::Role
    Condition: CampaignControllerEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: capacity-block-controller
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CampaignDescriptorParameterName}"
              - Effect: Allow
                Action: [ ec2:DescribeCapacityReservations, ec2:DescribeInstances ]
                Resource: "*"
              - Effect: Allow
                Action: [ ec2:RunInstances, ec2:CreateTags ]
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/campaign-run-id: !Ref CampaignRunId
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt InstanceRole.Arn
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

  CampaignControllerFunction:
    Type: AWS::Lambda::Function
    Condition: CampaignControllerEnabled
    Properties:
      FunctionName: !Sub "${ProjectTag}-capacity-block-controller"
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: !GetAtt CampaignControllerRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          CAMPAIGN_DESCRIPTOR_PARAMETER: !Ref CampaignDescriptorParameterName
      Code:
        S3Bucket: !Ref ModelBucket
        S3Key: !Ref ControllerCodeS3Key
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  CampaignControllerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CampaignControllerEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectTag}-capacity-block-controller"
      RetentionInDays: 14

  CampaignAlertTopic:
    Type: AWS::SNS::Topic
    Condition: CampaignAlertsEnabled
    Properties:
      TopicName: !Sub "${ProjectTag}-campaign-alerts"
      DisplayName: KEEP GLM52 alerts
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  CampaignAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CampaignAlertsEnabled
    Properties:
      Topics: [!Ref CampaignAlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref CampaignAlertTopic
          - Sid: CloudWatchAlarmPublish
            Effect: Allow
            Principal: { Service: cloudwatch.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref CampaignAlertTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${ProjectTag}-*"

  CampaignAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CampaignAlertsEnabled
    Properties:
      TopicArn: !Ref CampaignAlertTopic
      Protocol: email
      Endpoint: !Ref CampaignAlertEmail

  CampaignControllerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Condition: CampaignControllerEnabled
    Properties:
      QueueName: !Sub "${ProjectTag}-controller-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: project, Value: !Ref ProjectTag }
        - { Key: owner, Value: !Ref OwnerTag }

  CampaignControllerDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: CampaignControllerEnabled
    Properties:
      Queues: [!Ref CampaignControllerDeadLetterQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeDeadLetters
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt CampaignControllerDeadLetterQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectTag}-*"

  CapacityBlockDeliveredRule:
    Type: AWS::Events::Rule
    Condition: CampaignControllerEnabled
    DependsOn: CampaignControllerDeadLetterQueuePolicy
    Properties:
      EventPattern:
        source: [aws.ec2]
        detail-type: ["Capacity Block Reservation Delivered"]
        detail:
          capacity-reservation-id: [!Ref CapacityReservationId]
      Targets:
        - Arn: !GetAtt CampaignControllerFunction.Arn
          Id: campaign-controller
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 20
          DeadLetterConfig:
            Arn: !GetAtt CampaignControllerDeadLetterQueue.Arn

  CapacityBlockExpirationRule:
    Type: AWS::Events::Rule
    Condition: CampaignControllerEnabled
    DependsOn: CampaignControllerDeadLetterQueuePolicy
    Properties:
      EventPattern:
        source: [aws.ec2]
        detail-type: ["Capacity Block Reservation Expiration Warning"]
        detail:
          capacity-reservation-id: [!Ref CapacityReservationId]
      Targets:
        - Arn: !GetAtt CampaignControllerFunction.Arn
          Id: campaign-controller
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 20
          DeadLetterConfig:
            Arn: !GetAtt CampaignControllerDeadLetterQueue.Arn

  CapacityBlockInterruptionRule:
    Type: AWS::Events::Rule
    Condition: CampaignControllerEnabled
    DependsOn: CampaignControllerDeadLetterQueuePolicy
    Properties:
      EventPattern:
        source: [aws.ec2]
        detail-type:
          - "EC2 Capacity Reservation Instance Interruption Warning"
      Targets:
        - Arn: !GetAtt CampaignControllerFunction.Arn
          Id: campaign-controller
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 20
          DeadLetterConfig:
            Arn: !GetAtt CampaignControllerDeadLetterQueue.Arn

  CampaignControllerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-controller-errors"
      AlarmDescription: Capacity Block controller Lambda returned an error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CampaignControllerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CampaignControllerThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-controller-throttles"
      AlarmDescription: Capacity Block controller Lambda was throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref CampaignControllerFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CampaignControllerDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-controller-dlq-visible"
      AlarmDescription: EventBridge could not deliver a controller event.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CampaignControllerDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CapacityBlockDeliveredFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-delivery-failed-invocations"
      AlarmDescription: EventBridge failed to invoke the delivery controller target.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref CapacityBlockDeliveredRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CapacityBlockExpirationFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-expiration-failed-invocations"
      AlarmDescription: EventBridge failed to invoke the expiration controller target.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref CapacityBlockExpirationRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CapacityBlockInterruptionFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CampaignControllerEnabled
    DependsOn: CampaignAlertTopicPolicy
    Properties:
      AlarmName: !Sub "${ProjectTag}-interruption-failed-invocations"
      AlarmDescription: EventBridge failed to invoke the interruption controller target.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref CapacityBlockInterruptionRule
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref CampaignAlertTopic]

  CampaignControllerInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CampaignControllerEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CampaignControllerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CapacityBlockDeliveredRule.Arn

  CampaignControllerExpirationPermission:
    Type: AWS::Lambda::Permission
    Condition: CampaignControllerEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CampaignControllerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CapacityBlockExpirationRule.Arn

  CampaignControllerInterruptionPermission:
    Type: AWS::Lambda::Permission
    Condition: CampaignControllerEnabled
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CampaignControllerFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CapacityBlockInterruptionRule.Arn

Outputs:
  VpcId:
    Value: !Ref Vpc
  SubnetId:
    Value: !Ref PublicSubnet
  SubnetIdAltAz:
    Value: !Ref PublicSubnetAltAz
  SubnetIdAz3:
    Value: !Ref PublicSubnetAz3
  SubnetIdAz4:
    Value: !Ref PublicSubnetAz4
  SubnetIdAz5:
    Condition: Az5Enabled
    Value: !Ref PublicSubnetAz5
  SubnetIdAz6:
    Condition: Az6Enabled
    Value: !Ref PublicSubnetAz6
  SecurityGroupId:
    Value: !Ref InstanceSecurityGroup
  ModelBucketName:
    Value: !Ref ModelBucket
    Export: { Name: !Sub "${AWS::StackName}-ModelBucket" }
  S3BatchChecksumRoleArn:
    Value: !GetAtt S3BatchChecksumRole.Arn
  LaunchTemplateId:
    Value: !Ref GpuLaunchTemplate
    Export: { Name: !Sub "${AWS::StackName}-LaunchTemplate" }
  InstanceProfileArn:
    Value: !GetAtt InstanceProfile.Arn
  CampaignDescriptorParameter:
    Condition: CampaignControllerEnabled
    Value: !Ref CampaignDescriptorParameter
  CampaignControllerFunctionArn:
    Condition: CampaignControllerEnabled
    Value: !GetAtt CampaignControllerFunction.Arn
  CampaignControllerDeadLetterQueueUrl:
    Condition: CampaignControllerEnabled
    Value: !Ref CampaignControllerDeadLetterQueue
  CampaignControllerDeadLetterQueueArn:
    Condition: CampaignControllerEnabled
    Value: !GetAtt CampaignControllerDeadLetterQueue.Arn
  CampaignAlertTopicArn:
    Condition: CampaignAlertsEnabled
    Value: !Ref CampaignAlertTopic
  CampaignAlertEmail:
    Condition: CampaignAlertsEnabled
    Value: !Ref CampaignAlertEmail
  SkyPilotControllerRoleArn:
    Condition: SkyPilotSupportEnabled
    Value: !GetAtt SkyPilotControllerRole.Arn
  SkyPilotWorkerRoleArn:
    Condition: SkyPilotSupportEnabled
    Value: !GetAtt SkyPilotWorkerRole.Arn
  SkyWatchdogFunctionArn:
    Condition: SkyPilotSupportEnabled
    Value: !GetAtt SkyWatchdogFunction.Arn
  SkyWatchdogDeadLetterQueueUrl:
    Condition: SkyPilotSupportEnabled
    Value: !Ref SkyWatchdogDeadLetterQueue
  SkyWatchdogRuleName:
    Condition: SkyPilotSupportEnabled
    Value: !Ref SkyWatchdogRule
  SkyMustStartCancelFunctionArn:
    Condition: SkyMustStartCoordinatorEnabled
    Value: !GetAtt SkyMustStartCancelFunction.Arn
  SkyMustStartCancelDeadLetterQueueUrl:
    Condition: SkyMustStartCoordinatorEnabled
    Value: !Ref SkyMustStartCancelDeadLetterQueue
  SkyMustStartCancelRuleName:
    Condition: SkyMustStartCoordinatorEnabled
    Value: !Ref SkyMustStartCancelRule
  SkyWorkerStartV2FunctionArn:
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Value: !GetAtt SkyWorkerStartV2Function.Arn
  SkyWorkerStartV2DeadLetterQueueUrl:
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Value: !Ref SkyWorkerStartV2DeadLetterQueue
  SkyWorkerStartV2ObjectCreatedRuleName:
    Condition: SkyWorkerStartV2CoordinatorEnabled
    Value: !Ref SkyWorkerStartV2ObjectCreatedRule
  SkyGpuBudgetName:
    Condition: SkyPilotSupportEnabled
    Value: !Ref SkyGpuBudget
