name: glm52-campaign

num_nodes: 1

resources:
  infra: aws/us-west-2
  instance_type: p5.48xlarge
  use_spot: false
  disk_size: 300
  disk_tier: high
  max_hourly_cost: 55.04
  labels:
    project: keep-glm52
    owner: jack.mazac
    model: glm-5.2
  job_recovery:
    strategy: FAILOVER
    max_restarts_on_errors: 0

api_server_access: false

file_mounts:
  /tmp/glm52-worker-start-v2/publish_worker_start_v2.py: aws/glm52-gpu/skypilot/publish_worker_start_v2.py
  /tmp/glm52-worker-start-v2/glm52_sky_campaign.py: src/mlx_vq/quality/glm52_sky_campaign.py
  /tmp/glm52-worker-start-v2/glm52_sky_campaign_native.py: src/glm52_enforcement/glm52_sky_campaign.py
  /tmp/glm52-worker-start-v2/glm52_sky_must_start.py: src/mlx_vq/quality/glm52_sky_must_start.py
  /tmp/glm52-worker-start-v2/glm52_sky_must_start_native.py: src/glm52_enforcement/glm52_sky_must_start.py
  /tmp/glm52-worker-start-v2/glm52_sky_must_start_dynamic.py: src/mlx_vq/quality/glm52_sky_must_start_dynamic.py
  /tmp/glm52-worker-start-v2/glm52_sky_worker_must_start_v2.py: src/mlx_vq/quality/glm52_sky_worker_must_start_v2.py
  /tmp/glm52-worker-start-v2/sky_worker_start_v2_coordinator.py: aws/glm52-gpu/lambda/sky_worker_start_v2_coordinator.py
  /tmp/glm52-worker-start-v2/run_h100_qualification.sh: aws/glm52-gpu/skypilot/run_h100_qualification.sh
  /tmp/glm52-worker-start-v2/glm52_h100_qualification.py: src/mlx_vq/quality/glm52_h100_qualification.py
  /tmp/glm52-worker-start-v2/glm52_h100_qualification_native.py: src/glm52_enforcement/glm52_h100_qualification.py

envs:
  GLM52_CAMPAIGN_DESCRIPTOR_S3_URI: REQUIRED_AT_SUBMISSION
  GLM52_CAMPAIGN_DESCRIPTOR_SHA256: REQUIRED_AT_SUBMISSION
  GLM52_GPU_SPEND_APPROVAL_S3_URI: REQUIRED_AT_SUBMISSION
  GLM52_GPU_SPEND_APPROVAL_SHA256: REQUIRED_AT_SUBMISSION
  GLM52_SKY_JOB_NAME: REQUIRED_AT_SUBMISSION
  GLM52_MANAGED_MODE: qualification
  GLM52_SKY_SUBMISSION_INTENT_S3_URI: REQUIRED_AT_SUBMISSION
  GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256: REQUIRED_AT_SUBMISSION
  GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256: REQUIRED_AT_SUBMISSION

setup: |
  set -euo pipefail
  WORKER_V2=/tmp/glm52-worker-start-v2
  DESCRIPTOR="$WORKER_V2/campaign.json"
  INTENT="$WORKER_V2/SKYPILOT_SUBMISSION_INTENT.json"
  LATCH="$WORKER_V2/WORKER_START_LATCH.json"
  LATCH_TRANSPORT="$WORKER_V2/WORKER_START_LATCH_TRANSPORT.json"
  ACCEPTED="$WORKER_V2/WORKER_START_ACCEPTED.json"
  RECEIPT="$WORKER_V2/WORKER_START_ADMISSION_RECEIPT.json"
  APPROVAL="$WORKER_V2/GPU_SPEND_APPROVAL.json"
  for name in \
    GLM52_CAMPAIGN_DESCRIPTOR_S3_URI \
    GLM52_CAMPAIGN_DESCRIPTOR_SHA256 \
    GLM52_GPU_SPEND_APPROVAL_S3_URI \
    GLM52_GPU_SPEND_APPROVAL_SHA256 \
    GLM52_SKY_JOB_NAME \
    GLM52_MANAGED_MODE \
    GLM52_SKY_SUBMISSION_INTENT_S3_URI \
    GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256 \
    GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256; do
    value=$(printenv "$name")
    test -n "$value"
    test "$value" != REQUIRED_AT_SUBMISSION
  done
  test "$GLM52_MANAGED_MODE" = qualification
  /usr/bin/python3 - \
    "$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" \
    "$GLM52_GPU_SPEND_APPROVAL_SHA256" \
    "$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" \
    "$GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256" \
    "${SKYPILOT_MANAGED_JOB_ID:?SKYPILOT_MANAGED_JOB_ID is required}" <<'PY'
  import re
  import sys

  if any(re.fullmatch(r"[0-9a-f]{64}", value) is None for value in sys.argv[1:5]):
      raise SystemExit("campaign digest input is not canonical SHA-256")
  if re.fullmatch(r"[1-9][0-9]*", sys.argv[5]) is None:
      raise SystemExit("SkyPilot managed job ID is not a canonical positive integer")
  PY
  verify_sha256() {
    local expected=$1 path=$2 actual
    actual=$(/usr/bin/python3 - "$path" <<'PY'
  import hashlib
  import sys

  with open(sys.argv[1], "rb") as stream:
      print(hashlib.sha256(stream.read()).hexdigest())
  PY
    )
    test "$actual" = "$expected"
  }
  ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
  test "$ACCOUNT" = 246813579024
  sudo install -d -m 0755 /etc/keep-glm52 /opt/keep-campaign/repo
  aws s3 cp "$GLM52_CAMPAIGN_DESCRIPTOR_S3_URI" \
    "$DESCRIPTOR" --region us-west-2 --only-show-errors
  verify_sha256 "$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" "$DESCRIPTOR"
  aws s3 cp "$GLM52_SKY_SUBMISSION_INTENT_S3_URI" \
    "$INTENT" --region us-west-2 --only-show-errors
  verify_sha256 "$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" "$INTENT"
  /usr/bin/python3 - \
    "$INTENT" "$GLM52_SKY_JOB_NAME" "$GLM52_MANAGED_MODE" <<'PY'
  import json
  import sys

  intent = json.load(open(sys.argv[1], encoding="utf-8"))
  if type(intent) is not dict:
      raise SystemExit("submission intent is not an object")
  if intent.get("sky_job_name") != sys.argv[2]:
      raise SystemExit("submission intent job name mismatch")
  if intent.get("managed_mode") != sys.argv[3] or sys.argv[3] != "qualification":
      raise SystemExit("submission intent mode is not qualification")
  PY
  /usr/bin/python3 -I /tmp/glm52-worker-start-v2/publish_worker_start_v2.py publish-latch-v2 \
    --publisher-file-sha256 4d1d47aef6dd211c20b52f05ede9bd6d32c35433e305f2b1bd56b48c83b9051e \
    --campaign-policy /tmp/glm52-worker-start-v2/glm52_sky_campaign.py \
    --campaign-policy-file-sha256 77412115f6b8ce325177864418d838e0335d536329e8e7565d7811bcc806cd94 \
    --campaign-policy-native /tmp/glm52-worker-start-v2/glm52_sky_campaign_native.py \
    --campaign-policy-native-file-sha256 f023eaeddf8fac73fa6546e3c4a0b60dd32e5266f06e1519fe21e0444d445d03 \
    --must-start-policy /tmp/glm52-worker-start-v2/glm52_sky_must_start.py \
    --must-start-policy-file-sha256 478ac3a16ce8a77a4e844c1e0a3dca99454d50e7233fd7cd67dfa184b486860a \
    --must-start-policy-native /tmp/glm52-worker-start-v2/glm52_sky_must_start_native.py \
    --must-start-policy-native-file-sha256 e910d3d03f7b30b7b9b668e214b61ecc7cbd641a53dedabd620b8e14573d33f3 \
    --dynamic-policy /tmp/glm52-worker-start-v2/glm52_sky_must_start_dynamic.py \
    --dynamic-policy-file-sha256 527019a41b54f810e9f98734c2ca99acc5a7b370344adf48c80f46f925396e18 \
    --worker-policy /tmp/glm52-worker-start-v2/glm52_sky_worker_must_start_v2.py \
    --worker-policy-file-sha256 8dfad6682d8afc9774dc31385cfc9ecc8c8e2f80d9a535e3c8d4cf6cf0fa97df \
    --coordinator /tmp/glm52-worker-start-v2/sky_worker_start_v2_coordinator.py \
    --coordinator-file-sha256 efa7c48ad259e10c6ce0e4cb1db9ff0a6e6a9fa203274329a7c2eb5203366406 \
    --descriptor "$DESCRIPTOR" \
    --descriptor-s3-uri "$GLM52_CAMPAIGN_DESCRIPTOR_S3_URI" \
    --descriptor-file-sha256 "$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" \
    --intent "$INTENT" \
    --intent-s3-uri "$GLM52_SKY_SUBMISSION_INTENT_S3_URI" \
    --intent-file-sha256 "$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" \
    --intent-body-sha256 "$GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256" \
    --latch-output "$LATCH" \
    --latch-transport-output "$LATCH_TRANSPORT"
  WAIT_TIMEOUT_SECONDS=$(/usr/bin/python3 - "$INTENT" <<'PY'
  import json
  import sys
  from datetime import datetime, timezone

  intent = json.load(open(sys.argv[1], encoding="utf-8"))
  if intent.get("managed_mode") != "qualification":
      raise SystemExit("submission intent mode is not qualification")
  deadline = datetime.fromisoformat(
      str(intent["must_start_by"]).replace("Z", "+00:00")
  )
  if deadline.tzinfo is None:
      raise SystemExit("submission intent deadline lacks timezone")
  remaining = int(
      (deadline.astimezone(timezone.utc) - datetime.now(timezone.utc))
      .total_seconds()
  )
  if remaining <= 0:
      raise SystemExit("submission intent must-start deadline has elapsed")
  print(min(remaining, 600))
  PY
  )
  /usr/bin/python3 -I /tmp/glm52-worker-start-v2/publish_worker_start_v2.py replay-accepted-v2 \
    --publisher-file-sha256 4d1d47aef6dd211c20b52f05ede9bd6d32c35433e305f2b1bd56b48c83b9051e \
    --campaign-policy /tmp/glm52-worker-start-v2/glm52_sky_campaign.py \
    --campaign-policy-file-sha256 77412115f6b8ce325177864418d838e0335d536329e8e7565d7811bcc806cd94 \
    --campaign-policy-native /tmp/glm52-worker-start-v2/glm52_sky_campaign_native.py \
    --campaign-policy-native-file-sha256 f023eaeddf8fac73fa6546e3c4a0b60dd32e5266f06e1519fe21e0444d445d03 \
    --must-start-policy /tmp/glm52-worker-start-v2/glm52_sky_must_start.py \
    --must-start-policy-file-sha256 478ac3a16ce8a77a4e844c1e0a3dca99454d50e7233fd7cd67dfa184b486860a \
    --must-start-policy-native /tmp/glm52-worker-start-v2/glm52_sky_must_start_native.py \
    --must-start-policy-native-file-sha256 e910d3d03f7b30b7b9b668e214b61ecc7cbd641a53dedabd620b8e14573d33f3 \
    --dynamic-policy /tmp/glm52-worker-start-v2/glm52_sky_must_start_dynamic.py \
    --dynamic-policy-file-sha256 527019a41b54f810e9f98734c2ca99acc5a7b370344adf48c80f46f925396e18 \
    --worker-policy /tmp/glm52-worker-start-v2/glm52_sky_worker_must_start_v2.py \
    --worker-policy-file-sha256 8dfad6682d8afc9774dc31385cfc9ecc8c8e2f80d9a535e3c8d4cf6cf0fa97df \
    --coordinator /tmp/glm52-worker-start-v2/sky_worker_start_v2_coordinator.py \
    --coordinator-file-sha256 efa7c48ad259e10c6ce0e4cb1db9ff0a6e6a9fa203274329a7c2eb5203366406 \
    --descriptor "$DESCRIPTOR" \
    --descriptor-s3-uri "$GLM52_CAMPAIGN_DESCRIPTOR_S3_URI" \
    --descriptor-file-sha256 "$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" \
    --intent "$INTENT" \
    --intent-s3-uri "$GLM52_SKY_SUBMISSION_INTENT_S3_URI" \
    --intent-file-sha256 "$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" \
    --intent-body-sha256 "$GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256" \
    --latch "$LATCH" \
    --latch-transport "$LATCH_TRANSPORT" \
    --accepted-output "$ACCEPTED" \
    --admission-receipt-output "$RECEIPT" \
    --wait-timeout-seconds "$WAIT_TIMEOUT_SECONDS" \
    --poll-interval-seconds 5
  aws s3 cp "$GLM52_GPU_SPEND_APPROVAL_S3_URI" \
    "$APPROVAL" --region us-west-2 --only-show-errors
  verify_sha256 "$GLM52_GPU_SPEND_APPROVAL_SHA256" "$APPROVAL"
  REPO_URI=$(/usr/bin/python3 - "$DESCRIPTOR" <<'PY'
  import json
  import sys

  value = json.load(open(sys.argv[1], encoding="utf-8"))
  print(f"s3://{value['bucket']}/{value['repo_tar_key']}")
  PY
  )
  REPO_SHA=$(/usr/bin/python3 - "$DESCRIPTOR" <<'PY'
  import json
  import sys

  print(json.load(open(sys.argv[1], encoding="utf-8"))["repo_tar_sha256"])
  PY
  )
  aws s3 cp "$REPO_URI" /tmp/keep-campaign.tar.gz \
    --region us-west-2 --only-show-errors
  verify_sha256 "$REPO_SHA" /tmp/keep-campaign.tar.gz
  sudo tar -xzf /tmp/keep-campaign.tar.gz -C /opt/keep-campaign/repo
  cmp -s /tmp/glm52-worker-start-v2/publish_worker_start_v2.py \
      /opt/keep-campaign/repo/aws/glm52-gpu/skypilot/publish_worker_start_v2.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_campaign.py \
      /opt/keep-campaign/repo/src/mlx_vq/quality/glm52_sky_campaign.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_campaign_native.py \
      /opt/keep-campaign/repo/src/glm52_enforcement/glm52_sky_campaign.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_must_start.py \
      /opt/keep-campaign/repo/src/mlx_vq/quality/glm52_sky_must_start.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_must_start_native.py \
      /opt/keep-campaign/repo/src/glm52_enforcement/glm52_sky_must_start.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_must_start_dynamic.py \
      /opt/keep-campaign/repo/src/mlx_vq/quality/glm52_sky_must_start_dynamic.py
  cmp -s /tmp/glm52-worker-start-v2/glm52_sky_worker_must_start_v2.py \
      /opt/keep-campaign/repo/src/mlx_vq/quality/glm52_sky_worker_must_start_v2.py
  cmp -s /tmp/glm52-worker-start-v2/sky_worker_start_v2_coordinator.py \
      /opt/keep-campaign/repo/aws/glm52-gpu/lambda/sky_worker_start_v2_coordinator.py
  sudo install -m 0644 /tmp/glm52-worker-start-v2/campaign.json /etc/keep-glm52/campaign.json
  sudo install -m 0644 /tmp/glm52-worker-start-v2/GPU_SPEND_APPROVAL.json /etc/keep-glm52/GPU_SPEND_APPROVAL.json
  sudo install -m 0644 /tmp/glm52-worker-start-v2/SKYPILOT_SUBMISSION_INTENT.json /etc/keep-glm52/SKYPILOT_SUBMISSION_INTENT.json
  sudo install -m 0600 /tmp/glm52-worker-start-v2/WORKER_START_LATCH.json /etc/keep-glm52/WORKER_START_LATCH.json
  sudo install -m 0600 /tmp/glm52-worker-start-v2/WORKER_START_LATCH_TRANSPORT.json /etc/keep-glm52/WORKER_START_LATCH_TRANSPORT.json
  sudo install -m 0600 /tmp/glm52-worker-start-v2/WORKER_START_ACCEPTED.json /etc/keep-glm52/WORKER_START_ACCEPTED.json
  sudo install -m 0600 /tmp/glm52-worker-start-v2/WORKER_START_ADMISSION_RECEIPT.json /etc/keep-glm52/WORKER_START_ADMISSION_RECEIPT.json
  /usr/bin/sudo /usr/bin/env -i \
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
    HOME=/root \
    AWS_DEFAULT_REGION=us-west-2 \
    GLM52_LIVE_SKY_WORKER=1 \
    GLM52_MANAGED_MODE="$GLM52_MANAGED_MODE" \
    GLM52_CAMPAIGN_DESCRIPTOR_S3_URI="$GLM52_CAMPAIGN_DESCRIPTOR_S3_URI" \
    GLM52_CAMPAIGN_DESCRIPTOR_SHA256="$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" \
    GLM52_SKY_SUBMISSION_INTENT_S3_URI="$GLM52_SKY_SUBMISSION_INTENT_S3_URI" \
    GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256="$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" \
    GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256="$GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256" \
    SKYPILOT_MANAGED_JOB_ID="$SKYPILOT_MANAGED_JOB_ID" \
    /opt/keep-campaign/repo/aws/glm52-gpu/skypilot/bootstrap_campaign.sh

run: |
  /usr/bin/sudo /usr/bin/env -i \
    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
    HOME=/root \
    AWS_DEFAULT_REGION=us-west-2 \
    GLM52_LIVE_SKY_WORKER=1 \
    GLM52_MANAGED_MODE="$GLM52_MANAGED_MODE" \
    GLM52_SKY_JOB_NAME="$GLM52_SKY_JOB_NAME" \
    GLM52_CAMPAIGN_DESCRIPTOR_S3_URI="$GLM52_CAMPAIGN_DESCRIPTOR_S3_URI" \
    GLM52_CAMPAIGN_DESCRIPTOR_SHA256="$GLM52_CAMPAIGN_DESCRIPTOR_SHA256" \
    GLM52_SKY_SUBMISSION_INTENT_S3_URI="$GLM52_SKY_SUBMISSION_INTENT_S3_URI" \
    GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256="$GLM52_SKY_SUBMISSION_INTENT_FILE_SHA256" \
    GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256="$GLM52_SKY_SUBMISSION_INTENT_BODY_SHA256" \
    SKYPILOT_MANAGED_JOB_ID="$SKYPILOT_MANAGED_JOB_ID" \
    /opt/keep-campaign/repo/aws/glm52-gpu/skypilot/run_managed_campaign.sh
