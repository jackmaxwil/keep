# First recipe fixture: the accepted balanced-RC lineage rooted at the
# protected r26 seed. Encodes seed -> layer-45 gate/up/down rank-4 low-rank
# sidecar (8 math rows, indices 44-51 from both caches) -> audit + three
# split evals + paired Lane S. Hyperparameters transcribed from the accepted
# artifact's conversion-manifest run{} block.
#
# The position-scoped logit-bias bundle is intentionally NOT a promotable
# step: its metric profile is the promotion target (community_wow), and its
# prompt-independent replacement is the first `keep plan-next` proposal.
