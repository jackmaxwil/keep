schema_version: 1
name: glm52_reap_504b_eval_contract_20260709
description: >
  Freeze the pinned GLM-5.2 REAP source-relative release policy and the exact
  report/selection/holdout prompt pack before teacher or candidate metrics.
  This recipe does not claim that teacher logits, candidate logits, quality,
  benchmarks, or the family gate are ready.
external_inputs:
  tokenizer_snapshot:
    kind: artifact_dir
    path: /Users/jack.mazac/.cache/huggingface/hub/models--0xSero--glm-5.2-reap-504B-v2/snapshots/6c9241aa05fb243a0edb7c804c213ec1cf5c920d
  config_path:
    kind: file
    path: /Users/jack.mazac/.cache/huggingface/hub/models--0xSero--glm-5.2-reap-504B-v2/snapshots/6c9241aa05fb243a0edb7c804c213ec1cf5c920d/config.json
    expect_hash: 5fa690755d0dab25a8e0e5e0745675bdac03ba2b6f5641da2931278235c71f1b
steps:
  - id: tokenizer_readiness
    op: glm52-tokenizer-readiness-probe
