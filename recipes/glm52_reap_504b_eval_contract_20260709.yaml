  - id: eval_prompts
    op: glm52-family-eval-prompt-pack
    class: diagnostic
    inputs:
      tokenizer_dir: external:tokenizer_snapshot
      tokenizer_readiness_json: step:tokenizer_readiness/evidence_json
      family_policy_json: step:family_policy/evidence_json
