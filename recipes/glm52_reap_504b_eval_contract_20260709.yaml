      model_id: 0xSero/glm-5.2-reap-504B-v2
      revision: 6c9241aa05fb243a0edb7c804c213ec1cf5c920d
      prompt: The capital of France is

  - id: family_policy
    op: glm52-family-gate-policy
    class: diagnostic
