name: glm52_reap_504b_family_preflight_20260709
description: >
  Recompute the pinned GLM-5.2 REAP source, tokenizer, runtime, policy, prompt,
  and teacher-source metadata contracts, then compose the hard family release
  gate against the current six-group full-bind preflight. The terminal gate is
  intentionally fail-loud (exit 2) until the full 225-group artifact,
  production bind/generation, full-vocabulary quality rows, and same-machine
  pinned-FP4 benchmark evidence exist.
