      forward_layers: [0, 39]
      forward_top_k: 8
      input_scale: 0.125
      layer_only: true
      max_tensors: 700

  - id: runtime_global_logit_probe
    op: qwen-runtime-bind-forward-probe
    class: diagnostic
    inputs:
      artifact: step:materialize_groups/artifact
      source_dir: external:source_dir
      index_path: external:index_path
    params:
