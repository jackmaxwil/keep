schema_version: 1
name: qwen36_35b_a3b_materialization_probe_20260702
description: >
  Diagnostic Qwen 3.6 MoE source-to-artifact probe for onboarding the current
  small open Qwen MoE target before KEEP/RAMP conversion support. This bounded
  chain requires a local payload-bearing Hugging Face snapshot for real
  execution; it can be planned and dry-run against the pinned metadata snapshot.
external_inputs:
  source_dir:
    kind: artifact_dir
    path: /Users/jack.mazac/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0
  index_path:
    kind: file
    path: /Users/jack.mazac/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0/model.safetensors.index.json
  config_path:
    kind: file
    path: /Users/jack.mazac/.cache/huggingface/hub/models--Qwen--Qwen3.6-35B-A3B/snapshots/995ad96eacd98c81ed38be0c5b274b04031597b0/config.json
steps:
  - id: source_audit
    op: qwen-moe-source-audit
    class: diagnostic
    params:
      model_id: Qwen/Qwen3.6-35B-A3B
      revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
      expected_model_type: qwen3_5_moe
      expected_language_layers: 40
      expected_expert_tensors: 80
      verify_hf_shapes: true

  - id: source_payload_audit
    op: qwen-moe-source-payload-audit
    class: diagnostic
    inputs:
      source_dir: external:source_dir
      index_path: external:index_path
    params:
      model_id: Qwen/Qwen3.6-35B-A3B
      revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
      expected_language_layers: 40
      max_groups: 80
      code_bits: 8
      group_size: 512

  - id: materialize_groups
    op: qwen-moe-materialize-groups
    class: diagnostic
    inputs:
      source_dir: external:source_dir
      index_path: external:index_path
    params:
      model_id: Qwen/Qwen3.6-35B-A3B
      revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
      expected_language_layers: 40
      max_groups: 80
      skip_existing: true
      code_bits: 8
      group_size: 512

  - id: artifact_audit
    op: qwen-moe-artifact-audit
    class: diagnostic
    inputs:
      artifact: step:materialize_groups/artifact
    params:
      expected_source_projection_groups: 80
      expected_target_projection_groups: 120

  - id: bind_probe
    op: qwen-moe-bind-probe
    class: diagnostic
    inputs:
      artifact: step:materialize_groups/artifact
    params:
      expected_layers:
        [
          0,
