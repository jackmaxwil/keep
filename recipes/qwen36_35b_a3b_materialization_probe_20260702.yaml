  - id: runtime_bind_forward_probe
    op: qwen-runtime-bind-forward-probe
    class: diagnostic
    inputs:
      artifact: step:materialize_groups/artifact
      source_dir: external:source_dir
      index_path: external:index_path
    params:
      expected_layers:
        [
          0,
